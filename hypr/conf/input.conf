####################
### INPUT
####################

input {
    # Layout: us como padrão, alterna com alt+shift
    kb_layout  = us,br
    kb_variant = ,abnt2
    kb_options = grp:alt_shift_toggle

    follow_mouse = 1
    sensitivity  = 1
    accel_profile = flat

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace

device {
    name        = epic-mouse-v1
    sensitivity = -0.5
}
